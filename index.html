<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">

<style>

  :root{
    --ink:#1c2b3a;
    --paper:#f7f2e7;
    --paper-line:#e3d9c4;
    --gold:#b8892b;
    --gold-soft:#f0e3c4;
    --rust:#a94a3a;
    --rust-soft:#f3ddd6;
    --green:#3f7a4f;
    --green-soft:#dceedf;
    --slate:#5c6b78;
    --card:#fffdf8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 15% 0%, #24374a 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #223244 0%, transparent 40%);

  .wrap{

    margin:0 auto;

  header.hero{

    display:flex;
    align-items:center;

  .eyebrow{

    font-size:11px;

    border:none;

    text-decoration:underline;
    cursor:pointer;

  }

  .card{

    padding:16px;

    font-family:'Inter',sans-serif;

  }

  .del-btn{

    font-weight:600;

    font-size:13.5px;

  .pay-row .dt{

  .add-payment{
    display:flex;

  .amount-wrap{
    display:flex;
    align-items:center;

  .add-payment button{
    background:var(--ink);

    border-radius:8px;

  .fab-add{

  .empty{

  }

  #lockScreen{
    position:fixed;
    inset:0;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 15% 0%, #24374a 0%, transparent 45%),

  #lockScreen.hidden{ display:none; }
  .lock-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:16px;
    padding:28px 22px;
    max-width:320px;
    width:100%;

  .lock-card .eyebrow{ margin-bottom:8px; }
  .lock-card h2{
    font-family:'Fraunces',serif;

    font-size:22px;

  .lock-card input[type=password], .lock-card input[type=email]{

    width:100%;

<script>
const DAY_LABELS = ['Ya','Du','Se','Ch','Pa','Ju','Sh'];
const DAY_FULL = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const DAY_SHORT = ['yak','dush','sesh','chor','pay','jum','shan'];
const MONTH_LOWER = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const BOOK_OPTIONS = ["Qur'on", "Mabda ul-Qiroat", "Janob ut-Tolib"];
const TARIFFS = {
  '2': { days: 2, price: 20, label: '2 kunlik' },
  '3': { days: 3, price: 30, label: '3 kunlik' },
  '5': { days: 5, price: 50, label: '5 kunlik' }
};

function pad(n){ return n<10 ? '0'+n : ''+n; }
function dateStr(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function toDateStr(dt){ return dateStr(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
function formatDayLabel(dt){
  return `${dt.getDate()}-${MONTH_LOWER[dt.getMonth()]}, ${DAY_SHORT[dt.getDay()]}`;
}
function todayStr(){
  const t = new Date();
  return dateStr(t.getFullYear(), t.getMonth(), t.getDate());
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

let students = []; // {id, name, book, tariff:'2'|'3'|'5', startDate, days:[0..6]}
let attendance = {};
let makeupDates = {}; // legacy freeform entries (kept for backward compatibility display)
let reschedule = {}; // { studentId: { originalMissedDateStr: newDateStr } }
let payments = {};
let cycleView = {};
let newDaySelection = new Set();
let currentView = { type: 'list' }; // or { type:'detail', studentId }

const STORAGE_KEY = 'tutoring-tracker-v1';

// ================= Supabase (data + auth) =================
const SUPABASE_URL = 'https://dhfbohawufporplgezxi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoZmJvaGF3dWZwb3JwbGdlenhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTQ1NDAsImV4cCI6MjEwMzQ5MDU0MH0.h3U_85aTFjCX0zEkjp7haJNPnu6-KnOUSI8bfB4JgKE';
const CLOUD_ENABLED = true;

const AUTH_KEY = 'tutoring-tracker-auth';
let authSession = null;

function loadAuthSession(){
  try{
    const raw = localStorage.getItem(AUTH_KEY);
    if(raw) authSession = JSON.parse(raw);
  }catch(e){ authSession = null; }
}
function saveAuthSession(session){
  authSession = session;
  try{ localStorage.setItem(AUTH_KEY, JSON.stringify(session)); }catch(e){ /* ignore */ }
}
function clearAuthSession(){
  authSession = null;
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){ /* ignore */ }
}

async function authLogin(email, password){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || ('HTTP ' + res.status));
  saveAuthSession({
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in * 1000)
  });
}

async function authRefresh(){
  if(!authSession || !authSession.refresh_token) throw new Error('no refresh token');
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: authSession.refresh_token })
  });
  const data = await res.json();
  if(!res.ok) throw new Error('refresh failed');
  saveAuthSession({
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in * 1000)
  });
}

async function ensureValidToken(){
  if(!authSession) throw new Error('not logged in');
  if(Date.now() > authSession.expires_at - 60000){
    await authRefresh();
  }
  return authSession.access_token;
}

async function cloudGet(){
  const token = await ensureValidToken();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/tracker_data?id=eq.main&select=payload`, {
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` }
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const rows = await res.json();
  return (rows && rows[0]) ? rows[0].payload : null;
}

async function cloudSet(payload){
  const token = await ensureValidToken();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/tracker_data?on_conflict=id`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify([{ id: 'main', payload, updated_at: new Date().toISOString() }])
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
}

// ================= Cycle math =================
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function addMonthsClamped(date, n){
  const day = date.getDate();
  const target = new Date(date.getFullYear(), date.getMonth()+n, 1);
  const lastDay = daysInMonth(target.getFullYear(), target.getMonth());
  target.setDate(Math.min(day, lastDay));
  return target;
}
function getCycleBounds(startDateStr, idx){
  const start = new Date(startDateStr+'T00:00:00');
  const cycleStart = addMonthsClamped(start, idx);
  const cycleEndExclusive = addMonthsClamped(start, idx+1);
  const cycleEnd = new Date(cycleEndExclusive);
  cycleEnd.setDate(cycleEnd.getDate()-1);
  return {cycleStart, cycleEnd};
}
function defaultCycleIndex(startDateStr){
  const start = new Date(startDateStr+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  let months = (today.getFullYear()-start.getFullYear())*12 + (today.getMonth()-start.getMonth());
  if(today.getDate() < start.getDate()) months -= 1;
  return Math.max(0, months);
}
function datesInRange(startD, endD){
  const arr = [];
  let cur = new Date(startD);
  while(cur <= endD){
    arr.push(new Date(cur));
    cur.setDate(cur.getDate()+1);
  }
  return arr;
}
function computeMissedDatesInCycle(student, idx){
  if(idx < 0) return [];
  const {cycleStart, cycleEnd} = getCycleBounds(student.startDate, idx);
  const dates = datesInRange(cycleStart, cycleEnd).filter(dt=>student.days.includes(dt.getDay()));
  return dates.filter(dt=>{
    const key = `${student.id}:${toDateStr(dt)}`;
    return attendance[key] === 'missed';
  });
}
function computeMissedInCycle(student, idx){
  return computeMissedDatesInCycle(student, idx).length;
}
function formatCycleLabel(cycleStart, cycleEnd){
  return `${cycleStart.getDate()}-${MONTH_LOWER[cycleStart.getMonth()]} — ${cycleEnd.getDate()}-${MONTH_LOWER[cycleEnd.getMonth()]}`;
}

// ================= Payment balance =================
function computeBalance(student){
  const tariff = TARIFFS[student.tariff] || TARIFFS['3'];
  const cyclesElapsed = defaultCycleIndex(student.startDate) + 1;
  const expected = cyclesElapsed * tariff.price;
  const paid = (payments[student.id] || []).reduce((s,p)=> s + (Number(p.amount)||0), 0);
  return paid - expected;
}
function balanceClass(bal){
  if(bal > 0) return 'pos';
  if(bal < 0) return 'neg';
  return 'zero';
}
function balanceText(bal){
  if(bal > 0) return `+$${bal.toLocaleString('en-US')} ortiqcha`;
  if(bal < 0) return `-$${Math.abs(bal).toLocaleString('en-US')} qarz`;
  return '$0 · teng';
}
function monthsAheadText(student, bal){
  const tariff = TARIFFS[student.tariff] || TARIFFS['3'];
  if(bal > 0){
    const months = Math.floor(bal / tariff.price);
    if(months >= 1) return `Yana taxminan ${months} oyga yetadi (yangi to'lov shart emas)`;
    return `Keyingi oyni qisman qoplaydi`;
  }
  return '';
}

function renderDetail(studentId){
  const container = document.getElementById('mainContent');
  container.innerHTML = '';
  const student = students.find(s=>s.id===studentId);
  if(!student){ currentView = {type:'list'}; renderApp(); return; }

  const backRow = document.createElement('div');
  backRow.innerHTML = `<button class="back-btn" id="backBtn" style="margin-bottom:12px;">‹</button>`;
  container.appendChild(backRow);
  backRow.querySelector('#backBtn').onclick = ()=>{ currentView = {type:'list'}; renderApp(); };

  const card = document.createElement('div');
  card.className = 'card';

  const scheduledDayLabels = student.days.slice().sort().map(d=>DAY_FULL[d]).join(', ');
  const tariff = TARIFFS[student.tariff] || TARIFFS['3'];

  if(cycleView[student.id] === undefined){
    cycleView[student.id] = defaultCycleIndex(student.startDate);
  }
  const idx = cycleView[student.id];
  const { cycleStart, cycleEnd } = getCycleBounds(student.startDate, idx);
  const missedDatesPrev = computeMissedDatesInCycle(student, idx-1);
  const missedDatesCurrent = computeMissedDatesInCycle(student, idx);
  const allMissedDates = [...missedDatesPrev, ...missedDatesCurrent].sort((a,b)=>a-b);

  const cycleDates = datesInRange(cycleStart, cycleEnd).filter(dt => student.days.includes(dt.getDay()));

  const studentReschedule = reschedule[student.id] || {};
  const rescheduledTargetsInCycle = Object.entries(studentReschedule)
    .filter(([origDs, newDs]) => {
      const d = new Date(newDs+'T00:00:00');
      return d >= cycleStart && d <= cycleEnd;
    });
  const mk = (makeupDates[student.id] || []).filter(ds => {
    const d = new Date(ds+'T00:00:00');
    return d >= cycleStart && d <= cycleEnd;
  });

  let doneCount = 0, missedCount = 0, totalCount = cycleDates.length + mk.length + rescheduledTargetsInCycle.length;
  cycleDates.forEach(dt=>{
    const key = `${student.id}:${toDateStr(dt)}`;
    const st = attendance[key];
    if(st==='done') doneCount++;
    else if(st==='missed') missedCount++;
  });
  mk.forEach(ds=>{
    const key = `${student.id}:${ds}`;
    const st = attendance[key];
    if(st==='done') doneCount++;
    else if(st==='missed') missedCount++;
  });
  rescheduledTargetsInCycle.forEach(([origDs, newDs])=>{
    const key = `${student.id}:${newDs}`;
    const st = attendance[key];
    if(st==='done') doneCount++;
    else if(st==='missed') missedCount++;
  });

  const studentPayments = (payments[student.id] || []).slice().sort((a,b)=> b.date.localeCompare(a.date));
  const bal = computeBalance(student);

  card.innerHTML = `
    <div class="detail-head">
      <div class="detail-name">${escapeHtml(student.name)}</div>
      <div style="display:flex; gap:12px;">
        <button class="del-btn" data-edit="${student.id}">tahrirlash</button>
        <button class="del-btn" data-del="${student.id}">o'chirish</button>
      </div>
    </div>
    <div class="student-days">${scheduledDayLabels || 'kunlar tanlanmagan'} · ${tariff.label} ($${tariff.price})</div>
    ${student.book ? `<div class="student-book">📖 <b>Kitob:</b> ${escapeHtml(student.book)}</div>` : ''}

    <div class="cycle-nav">
      <button data-cycle-prev="${student.id}">‹</button>
      <div class="cycle-label">${formatCycleLabel(cycleStart, cycleEnd)}</div>
      <button data-cycle-next="${student.id}">›</button>
    </div>

    <div class="stats-row">
      <div class="stat"><div class="n">${totalCount}</div><div class="l">jami</div></div>
      <div class="stat done"><div class="n">${doneCount}</div><div class="l">bo'ldi</div></div>
      <div class="stat missed"><div class="n">${missedCount}</div><div class="l">o'tmadi</div></div>
    </div>

    <div class="section-label">Qoldirilgan darslar</div>
    <div class="day-rows" id="missedList-${student.id}" style="margin-bottom:14px;"></div>

    <div class="section-label">Dars kunlari</div>
    <div class="day-rows" data-rows="${student.id}"></div>

    <div class="section-label">To'lov holati</div>
    <div class="balance-banner ${balanceClass(bal)}">${balanceText(bal)}</div>
    ${bal > 0 ? `<div class="err-inline" style="color:var(--slate); margin-bottom:8px;">${monthsAheadText(student, bal)}</div>` : ''}
    <button class="quick-pay-btn" data-quick-pay="${student.id}">+ Yangi to'lov qabul qilindi — $${tariff.price}</button>
    <div class="pay-rows" data-payrows="${student.id}"></div>
    <div class="add-payment">
      <div class="amount-wrap"><span>$</span><input type="number" data-pay-amount="${student.id}" placeholder="Summa" min="0"></div>
      <input type="date" data-pay-date="${student.id}">
      <button data-add-payment="${student.id}">+ To'lov</button>
    </div>
  `;
  container.appendChild(card);

  // ---- Missed lessons list (with reschedule action) ----
  const missedListEl = card.querySelector(`#missedList-${student.id}`);
  if(allMissedDates.length === 0){
    missedListEl.innerHTML = '<div class="empty" style="padding:10px;">Qoldirilgan dars yo\'q.</div>';
  } else {
    allMissedDates.forEach(dt=>{
      const origDs = toDateStr(dt);
      const newDs = studentReschedule[origDs];
      const row = document.createElement('div');
      row.className = 'day-row';
      if(newDs){
        row.innerHTML = `
          <div class="d">${formatDayLabel(dt)} <small>→ ${formatDayLabel(new Date(newDs+'T00:00:00'))}ga ko'chirildi</small></div>
          <button type="button" class="rm" data-undo-reschedule="${student.id}" data-orig="${origDs}" style="background:none;border:1px solid var(--paper-line);color:var(--slate);font-size:16px;cursor:pointer;padding:6px 12px;border-radius:8px;min-width:36px;min-height:36px;">×</button>
        `;
      } else {
        row.innerHTML = `
          <div class="d">${formatDayLabel(dt)}</div>
          <button class="makeup-toggle-btn" style="margin:0; width:auto; padding:6px 12px; font-size:11.5px;" data-start-reschedule="${student.id}" data-orig="${origDs}">Ko'chirish</button>
        `;
      }
      missedListEl.appendChild(row);

      // inline date-picker row, shown when "Ko'chirish" tapped
      const pickerRow = document.createElement('div');
      pickerRow.id = `reschedulePicker-${student.id}-${origDs}`;
      pickerRow.style.display = 'none';
      pickerRow.style.padding = '8px 10px';
      pickerRow.innerHTML = `
        <div style="display:flex; gap:8px;">
          <input type="date" data-reschedule-input="${student.id}" data-reschedule-orig="${origDs}" style="flex:1;">
          <button data-reschedule-confirm="${student.id}" data-reschedule-orig2="${origDs}" style="background:var(--gold); border:none; color:#fff; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:600;">Tasdiqlash</button>
        </div>
      `;
      missedListEl.appendChild(pickerRow);
    });
  }

  const rowsEl = card.querySelector(`[data-rows="${student.id}"]`);
  const allEntries = [
    ...cycleDates.map(dt=>({date: dt, ds: toDateStr(dt), tag:null, kind:'regular'})),
    ...mk.map(ds=>({date: new Date(ds+'T00:00:00'), ds, tag:'qo\'shimcha dars', kind:'legacy'})),
    ...rescheduledTargetsInCycle.map(([origDs,newDs])=>({date: new Date(newDs+'T00:00:00'), ds:newDs, tag: `${formatDayLabel(new Date(origDs+'T00:00:00'))}dan ko'chirilgan`, kind:'rescheduled', origDs}))
  ].sort((a,b)=>a.date-b.date);

  allEntries.forEach(entry=>{
    const key = `${student.id}:${entry.ds}`;
    const st = attendance[key];
    const row = document.createElement('div');
    row.className = 'day-row' + (entry.tag ? ' makeup' : '');
    let removeBtn = '';
    if(entry.kind === 'legacy'){
      removeBtn = `<button type="button" class="rm" data-rm-legacy="${student.id}" data-rm-legacy-ds="${entry.ds}" style="background:none;border:1px solid var(--paper-line);color:var(--slate);font-size:16px;cursor:pointer;padding:6px 12px;border-radius:8px;min-width:36px;min-height:36px;">×</button>`;
    } else if(entry.kind === 'rescheduled'){
      removeBtn = `<button type="button" class="rm" data-undo-reschedule="${student.id}" data-orig="${entry.origDs}" style="background:none;border:1px solid var(--paper-line);color:var(--slate);font-size:16px;cursor:pointer;padding:6px 12px;border-radius:8px;min-width:36px;min-height:36px;">×</button>`;
    }
    row.innerHTML = `
      <div class="d">${formatDayLabel(entry.date)}
        ${entry.tag ? `<small>${entry.tag}</small>` : ''}
      </div>
      <div class="status-toggle">
        <button data-set="${key}" data-val="done" class="${st==='done'?'active-done':''}">Bo'ldi</button>
        <button data-set="${key}" data-val="missed" class="${st==='missed'?'active-missed':''}">O'tmadi</button>
        ${removeBtn}
      </div>
    `;
    rowsEl.appendChild(row);
  });

  const payRowsEl = card.querySelector(`[data-payrows="${student.id}"]`);
  if(studentPayments.length === 0){
    payRowsEl.innerHTML = '<div class="empty" style="padding:10px;">Hali to\'lov qayd etilmagan.</div>';
  } else {
    studentPayments.forEach(p=>{
      const originalIndex = (payments[student.id]||[]).indexOf(p);
      const row = document.createElement('div');
      row.className = 'pay-row';
      row.innerHTML = `
        <div><span class="amt">$${Number(p.amount).toLocaleString('en-US')}</span> <span class="dt">— ${formatDayLabel(new Date(p.date+'T00:00:00'))}</span></div>
        <button class="rm" data-rm-payment="${student.id}" data-rm-index="${originalIndex}">×</button>
      `;
      payRowsEl.appendChild(row);
    });
  }

  // ---- events ----
  card.querySelectorAll('[data-set]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.getAttribute('data-set');
      const val = btn.getAttribute('data-val');
      attendance[key] = (attendance[key] === val) ? undefined : val;
      if(attendance[key] === undefined) delete attendance[key];
      queueSave();
      renderApp();
    };
  });
  card.querySelectorAll('[data-start-reschedule]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-start-reschedule');
      const orig = btn.getAttribute('data-orig');
      const picker = card.querySelector(`#reschedulePicker-${id}-${orig}`);
      picker.style.display = picker.style.display === 'none' ? 'block' : 'none';
    };
  });
  card.querySelectorAll('[data-reschedule-confirm]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-reschedule-confirm');
      const orig = btn.getAttribute('data-reschedule-orig2');
      const input = card.querySelector(`[data-reschedule-input="${id}"][data-reschedule-orig="${orig}"]`);
      if(!input.value) return;
      if(!reschedule[id]) reschedule[id] = {};
      reschedule[id][orig] = input.value;
      queueSave();
      renderApp();
    };
  });
  card.querySelectorAll('[data-rm-legacy]').forEach(btn=>{
    btn.addEventListener('click', function(e){
      e.preventDefault();
      const id = this.getAttribute('data-rm-legacy');
      const ds = this.getAttribute('data-rm-legacy-ds');
      if(makeupDates[id]){
        makeupDates[id] = makeupDates[id].filter(d => d !== ds);
        delete attendance[`${id}:${ds}`];
        queueSave();
        renderApp();
      }
    });
  });
  card.querySelectorAll('[data-undo-reschedule]').forEach(btn=>{
    btn.addEventListener('click', function(e){
      e.preventDefault();
      const id = this.getAttribute('data-undo-reschedule');
      const orig = this.getAttribute('data-orig');
      if(reschedule[id] && reschedule[id][orig] !== undefined){
        const newDs = reschedule[id][orig];
        if(newDs) delete attendance[`${id}:${newDs}`];
        delete reschedule[id][orig];
        queueSave();
        renderApp();
      }
    });
  });
  card.querySelector(`[data-edit="${student.id}"]`).onclick = ()=>{
    editFormOpen = true;
    editingStudentId = student.id;
    renderApp();
  };
  card.querySelector(`[data-del="${student.id}"]`).onclick = ()=>{
    if(confirm(`"${student.name}"ni o'chirmoqchimisiz?`)){
      students = students.filter(s=>s.id!==student.id);
      currentView = {type:'list'};
      queueSave();
      renderApp();
    }
  };
  card.querySelector(`[data-quick-pay="${student.id}"]`).onclick = ()=>{
    if(!payments[student.id]) payments[student.id] = [];
    payments[student.id].push({ amount: tariff.price, date: todayStr() });
    queueSave();
    renderApp();
  };
  card.querySelector(`[data-add-payment="${student.id}"]`).onclick = ()=>{
    const amountInput = card.querySelector(`[data-pay-amount="${student.id}"]`);
    const dateInput = card.querySelector(`[data-pay-date="${student.id}"]`);
    const amount = Number(amountInput.value);
    if(!amount || amount <= 0){ amountInput.focus(); return; }
    if(!dateInput.value){ dateInput.focus(); return; }
    if(!payments[student.id]) payments[student.id] = [];
    payments[student.id].push({ amount, date: dateInput.value });
    queueSave();
    renderApp();
  };
  card.querySelectorAll('[data-rm-payment]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-rm-payment');
      const idx2 = Number(btn.getAttribute('data-rm-index'));
      if(payments[id]){
        payments[id].splice(idx2, 1);
        queueSave();
        renderApp();
      }
    };
  });
  card.querySelector(`[data-cycle-prev="${student.id}"]`).onclick = ()=>{
    cycleView[student.id] = (cycleView[student.id] ?? 0) - 1;
    renderApp();
  };
  card.querySelector(`[data-cycle-next="${student.id}"]`).onclick = ()=>{
    cycleView[student.id] = (cycleView[student.id] ?? 0) + 1;
    renderApp();
  };
}

    const bookSelect = document.getElementById('newStudentBookSelect');
    const bookCustom = document.getElementById('newStudentBookCustom');
    const startInput = document.getElementById('newStudentStart');
    const err = document.getElementById('addErr');
    const name = nameInput.value.trim();
    if(!name){ err.textContent = 'Ismni kiriting.'; nameInput.focus(); return; }
    if(newDaySelection.size === 0){ err.textContent = 'Kamida bitta kun tanlang.'; return; }

    const tariffDays = TARIFFS[selectedTariff].days;
    if(newDaySelection.size !== tariffDays){
      const proceed = confirm(`Siz ${TARIFFS[selectedTariff].label} tarif tanladingiz, lekin ${newDaySelection.size} kun belgiladingiz. Shunday davom etamizmi?`);
      if(!proceed) return;
    }

    const book = bookSelect.value === '__other__' ? bookCustom.value.trim() : bookSelect.value;
    const id = 's' + Date.now() + Math.random().toString(36).slice(2,7);
    students.push({
      id,
      name,
      book,
      tariff: selectedTariff,
      startDate: startInput.value || todayStr(),
      days: Array.from(newDaySelection).sort()
    });
    newDaySelection = new Set();
    selectedTariff = '3';
    addFormOpen = false;
    queueSave();
    renderApp();
  };
}

function renderDayPickerInto(el){
  el.innerHTML = '';
  DAY_LABELS.forEach((lbl,i)=>{
    const chip = document.createElement('div');
    chip.className = 'day-chip' + (newDaySelection.has(i) ? ' on' : '');
    chip.textContent = lbl;
    chip.onclick = ()=>{
      if(newDaySelection.has(i)) newDaySelection.delete(i);
      else newDaySelection.add(i);
      renderDayPickerInto(el);
    };
    el.appendChild(chip);
  });
}

// ================= Edit-student form =================
function renderEditForm(){
  const container = document.getElementById('mainContent');
  container.innerHTML = '';
  const student = students.find(s=>s.id===editingStudentId);
  if(!student){ editFormOpen = false; currentView = {type:'list'}; renderApp(); return; }

  const card = document.createElement('div');
  card.className = 'card';

  const isCustomBook = student.book && !BOOK_OPTIONS.includes(student.book);
  let bookOptionsHtml = BOOK_OPTIONS.map(b=>`<option value="${escapeHtml(b)}"${b===student.book?' selected':''}>${escapeHtml(b)}</option>`).join('');

  card.innerHTML = `
    <div class="field-label">Ism</div>
    <input type="text" id="editStudentName" maxlength="40" value="${escapeHtml(student.name)}">

    <div class="field-label">Kitob</div>
    <select id="editStudentBookSelect">
      ${bookOptionsHtml}
      <option value="__other__"${isCustomBook?' selected':''}>Boshqa...</option>
    </select>
    <input type="text" id="editStudentBookCustom" placeholder="Kitob nomini yozing" style="display:${isCustomBook?'block':'none'}; margin-top:8px;" value="${isCustomBook?escapeHtml(student.book):''}">

    <div class="field-label">Tarif</div>
    <div class="tariff-row" id="editTariffRow">
      ${Object.entries(TARIFFS).map(([k,t])=>`<div class="tariff-chip${k===student.tariff?' on':''}" data-edit-tariff="${k}"><div class="t1">$${t.price}</div><div class="t2">${t.label}</div></div>`).join('')}
    </div>

    <div class="field-label">Boshlagan sana</div>
    <input type="date" id="editStudentStart" value="${student.startDate}">

    <div class="field-label">Haftalik kunlar</div>
    <div class="day-picker" id="editDayPicker"></div>
    <div class="err-inline" id="editErr"></div>

    <button class="primary-btn" id="submitEditBtn">Saqlash</button>
    <button class="primary-btn" id="cancelEditBtn" style="background:var(--paper); color:var(--ink); margin-top:8px;">Bekor qilish</button>
  `;
  container.appendChild(card);

  let editDaySelection = new Set(student.days);
  let editSelectedTariff = student.tariff;

  function renderEditDayPicker(){
    const el = document.getElementById('editDayPicker');
    el.innerHTML = '';
    DAY_LABELS.forEach((lbl,i)=>{
      const chip = document.createElement('div');
      chip.className = 'day-chip' + (editDaySelection.has(i) ? ' on' : '');
      chip.textContent = lbl;
      chip.onclick = ()=>{
        if(editDaySelection.has(i)) editDaySelection.delete(i);
        else editDaySelection.add(i);
        renderEditDayPicker();
      };
      el.appendChild(chip);
    });
  }
  renderEditDayPicker();

  card.querySelector('#editStudentBookSelect').onchange = (e)=>{
    document.getElementById('editStudentBookCustom').style.display = e.target.value === '__other__' ? 'block' : 'none';
  };

  card.querySelectorAll('[data-edit-tariff]').forEach(chip=>{
    chip.onclick = ()=>{
      editSelectedTariff = chip.getAttribute('data-edit-tariff');
      card.querySelectorAll('[data-edit-tariff]').forEach(c=>c.classList.remove('on'));
      chip.classList.add('on');
    };
  });

  card.querySelector('#cancelEditBtn').onclick = ()=>{
    editFormOpen = false;
    editingStudentId = null;
    renderApp();
  };

  card.querySelector('#submitEditBtn').onclick = ()=>{
    const nameInput = document.getElementById('editStudentName');
    const bookSelect = document.getElementById('editStudentBookSelect');
    const bookCustom = document.getElementById('editStudentBookCustom');
    const startInput = document.getElementById('editStudentStart');
    const err = document.getElementById('editErr');
    const name = nameInput.value.trim();
    if(!name){ err.textContent = 'Ismni kiriting.'; nameInput.focus(); return; }
    if(editDaySelection.size === 0){ err.textContent = 'Kamida bitta kun tanlang.'; return; }

    const tariffDays = TARIFFS[editSelectedTariff].days;
    if(editDaySelection.size !== tariffDays){
      const proceed = confirm(`Siz ${TARIFFS[editSelectedTariff].label} tarif tanladingiz, lekin ${editDaySelection.size} kun belgiladingiz. Shunday davom etamizmi?`);
      if(!proceed) return;
    }

    const book = bookSelect.value === '__other__' ? bookCustom.value.trim() : bookSelect.value;
    student.name = name;
    student.book = book;
    student.tariff = editSelectedTariff;
    student.startDate = startInput.value || student.startDate;
    student.days = Array.from(editDaySelection).sort();

    editFormOpen = false;
    editingStudentId = null;
    queueSave();
    renderApp();
  };
}

document.getElementById('fabAdd').onclick = ()=>{
  addFormOpen = true;
  newDaySelection = new Set();
  selectedTariff = '3';
  renderAddForm();
};

// override renderApp to respect addFormOpen / editFormOpen
const _origRenderApp = renderApp;
renderApp = function(){
  if(addFormOpen){
    document.getElementById('pageTitle').textContent = 'Yangi o\'quvchi';
    document.getElementById('fabAdd').style.display = 'none';
    renderAddForm();
    return;
  }
  if(editFormOpen){
    document.getElementById('pageTitle').textContent = 'Tahrirlash';
    document.getElementById('fabAdd').style.display = 'none';
    renderEditForm();
    return;
  }
  _origRenderApp();
};

// ================= Auth =================
loadAuthSession();

async function tryLogin(){
  const emailInput = document.getElementById('lockEmail');
  const passInput = document.getElementById('lockInput');
  const err = document.getElementById('lockErr');
  const btn = document.getElementById('lockBtn');
  err.textContent = '';
  if(!emailInput.value || !passInput.value){
    err.textContent = 'Email va parolni kiriting.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Tekshirilmoqda…';
  try{
    await authLogin(emailInput.value.trim(), passInput.value);
    document.getElementById('lockScreen').classList.add('hidden');
    loadData();
  }catch(e){
    err.textContent = 'Xato: ' + (e && e.message ? e.message : String(e));
    passInput.value = '';
    passInput.focus();
  }
  btn.disabled = false;
  btn.textContent = 'Kirish';
}

document.getElementById('logoutBtn').onclick = ()=>{
  if(confirm('Tizimdan chiqmoqchimisiz?')){
    clearAuthSession();
    location.reload();
  }
};

(async function initAuth(){
  if(authSession){
    try{
      await ensureValidToken();
      document.getElementById('lockScreen').classList.add('hidden');
      loadData();
      return;
    }catch(e){
      clearAuthSession();
    }
  }
  document.getElementById('lockBtn').onclick = tryLogin;
  document.getElementById('lockInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') tryLogin();
  });
  document.getElementById('lockEmail').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('lockInput').focus();
  });
  setTimeout(()=> document.getElementById('lockEmail').focus(), 100);
})();
</script>
